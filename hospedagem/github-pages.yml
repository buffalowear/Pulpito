# Publica o Púlpito no GitHub Pages (hospedagem gratuita do próprio GitHub).
#
# Como usar: num repositório que tenha SÓ o Púlpito na raiz (os arquivos desta pasta
# "pulpito/"), copie este arquivo para  .github/workflows/publicar.yml  e, no GitHub:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → Variables → crie:
#        SUPABASE_URL       (endereço do projeto no Supabase)
#        SUPABASE_ANON_KEY  (chave pública "anon")
# A cada envio para o ramo principal o site é publicado em
#   https://SEU-USUARIO.github.io/NOME-DO-REPOSITORIO/
name: Publicar o Púlpito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
